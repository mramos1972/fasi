spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fasi_dev}
spring.datasource.username=${DB_USER:fasi}
spring.datasource.password=${DB_PASS:fasi}
spring.datasource.driver-class-name=org.postgresql.Driver

# SQL en consola desactivado por defecto (ralentiza y ensucia el log). Activar con SHOW_SQL=true
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

logging.level.com.miempresa.fasi=${APP_LOG_LEVEL:INFO}
server.address=0.0.0.0

# ── Ollama / IA local ────────────────────────────────────────
fasi.ollama.url=${OLLAMA_URL:http://host.docker.internal:11434}
fasi.ollama.model=${OLLAMA_MODEL:qwen2.5:0.5b}
