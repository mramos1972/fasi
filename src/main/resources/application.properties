spring.application.name=fasi
spring.profiles.active=${SPRING_PROFILE:dev}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.thymeleaf.cache=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
fasi.upload.dir=${UPLOAD_DIR:./uploads}

# ── Ollama / IA local (solo fallback experimental) ───────────
fasi.ollama.url=${OLLAMA_URL:http://localhost:11434}
fasi.ollama.model=${OLLAMA_MODEL:qwen2.5:0.5b}

# ── IA Central (Google Gemini, API nativa) ───────────────────
fasi.ai.provider.url=${AI_API_URL:https://generativelanguage.googleapis.com/v1beta}
fasi.ai.provider.api-key=${AI_API_KEY:}
fasi.ai.provider.model=${AI_MODEL:gemini-3.8-flash}
fasi.ai.provider.timeout-seconds=${AI_TIMEOUT:45}
# Pensamiento del modelo: auto | budget | level | off
fasi.ai.provider.thinking=${AI_THINKING:auto}
# Nivel para la familia 3.x: minimal | low | medium | high  (minimal = mas rapido; suficiente para calendario)
fasi.ai.provider.thinking-level=${AI_THINKING_LEVEL:minimal}
fasi.ai.provider.max-retries=${AI_MAX_RETRIES:2}
