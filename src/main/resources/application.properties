spring.application.name=fasi
spring.profiles.active=${SPRING_PROFILE:dev}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.thymeleaf.cache=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
fasi.upload.dir=${UPLOAD_DIR:./uploads}

# ── Ollama / IA local (solo fallback experimental) ───────────
fasi.ollama.url=${OLLAMA_URL:http://localhost:11434}
fasi.ollama.model=${OLLAMA_MODEL:qwen2.5:0.5b}

# ── IA Central (Google Gemini, API nativa) ───────────────────
fasi.ai.provider.url=${AI_API_URL:https://generativelanguage.googleapis.com/v1beta}
fasi.ai.provider.api-key=${AI_API_KEY:}
fasi.ai.provider.model=${AI_MODEL:gemini-3.8-flash}
# Modelos de respaldo si el principal agota su cuota diaria (cada modelo tiene cupo propio en el free tier).
# Con facturacion activa (Tier 1) no se usan nunca.
fasi.ai.provider.fallback-models=${AI_FALLBACK_MODELS:gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite}
fasi.ai.provider.timeout-seconds=${AI_TIMEOUT:45}
fasi.ai.provider.thinking=${AI_THINKING:auto}
fasi.ai.provider.thinking-level=${AI_THINKING_LEVEL:minimal}
fasi.ai.provider.max-retries=${AI_MAX_RETRIES:2}

# ===================================================================
# CONFIGURACIÓN NOTIFICACIONES EMAIL (RESEND)
# ===================================================================
spring.mail.host=smtp.resend.com
spring.mail.port=465
spring.mail.username=resend
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

fasi.recordatorios.remitente=onboarding@resend.dev
fasi.recordatorios.email-destino=ramosrequejomiguel@gmail.com
