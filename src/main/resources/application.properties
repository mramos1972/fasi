spring.application.name=fasi
spring.profiles.active=${SPRING_PROFILE:dev}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.thymeleaf.cache=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
fasi.upload.dir=${UPLOAD_DIR:./uploads}

# ── Ollama / IA local (solo fallback experimental) ───────────
fasi.ollama.url=${OLLAMA_URL:http://localhost:11434}
fasi.ollama.model=${OLLAMA_MODEL:qwen2.5:0.5b}

# ── IA Central (Google Gemini, API nativa) ───────────────────
fasi.ai.provider.url=${AI_API_URL:https://generativelanguage.googleapis.com/v1beta}
fasi.ai.provider.api-key=${AI_API_KEY:}
fasi.ai.provider.model=${AI_MODEL:gemini-2.5-flash}
# Segundos de espera por respuesta (antes 12 s fijos: causa de los "request timed out")
fasi.ai.provider.timeout-seconds=${AI_TIMEOUT:45}
# 0 = sin "pensamiento" (rapido). -1 = no enviar el parametro (si el modelo no lo soporta se reintenta solo)
fasi.ai.provider.thinking-budget=${AI_THINKING_BUDGET:0}
# Reintentos ante timeout / 429 / 503
fasi.ai.provider.max-retries=${AI_MAX_RETRIES:2}
