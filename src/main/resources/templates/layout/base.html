<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:replace="${title}">FASI</title>
  
  <script src="/js/tailwind.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50:'#eef2ff', 100:'#e0e7ff', 500:'#6366f1', 600:'#4f46e5', 700:'#4338ca' }
          }
        }
      }
    }
  </script>
  <style>
    .fasi-modal { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 1rem; }
    .fasi-drawer { position: fixed; top: 0; right: 0; height: 100%; width: 18rem; z-index: 9998; transform: translateX(100%); transition: transform 0.3s ease; }
    .fasi-drawer.open { transform: translateX(0) !important; }
    .fasi-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9997; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

<!-- TOPBAR -->
<header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-30 px-4 py-2.5 flex items-center justify-between shadow-sm">
  <div class="flex items-center gap-1 min-w-0 flex-1">
    <a th:href="@{/}" class="flex items-center justify-center w-10 h-10 text-2xl flex-shrink-0 hover:bg-stone-200 dark:hover:bg-gray-700 rounded-full transition" title="Inicio">
      ⚡
    </a>
    <div id="header-title-slot" class="flex items-center gap-1 min-w-0 flex-1 overflow-hidden"></div>
  </div>

  <div class="flex items-center gap-2 flex-shrink-0">
    <button type="button" id="btn-topbar-asistente"
            class="w-10 h-10 flex items-center justify-center rounded-full bg-indigo-600 hover:bg-indigo-500 text-white transition text-xl font-bold shadow cursor-pointer"
            title="Asistente Inteligente FASI">
      +
    </button>
    <button type="button" id="btn-topbar-menu"
            class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-stone-200 dark:hover:bg-gray-700 transition text-2xl cursor-pointer"
            title="Menú">
      ☰
    </button>
  </div>
</header>

<!-- OVERLAY & DRAWER LATERAL -->
<div id="menu-overlay" class="fasi-overlay"></div>

<aside id="sidebar-menu" class="fasi-drawer bg-gray-900 text-gray-100 flex flex-col shadow-2xl">
  <div class="flex items-center justify-between px-5 py-4 border-b border-gray-800">
    <span class="font-bold text-lg">⚡ FASI</span>
    <button type="button" id="btn-drawer-cerrar" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-800 transition text-gray-400 hover:text-white cursor-pointer">✕</button>
  </div>

  <div class="px-5 py-3 border-b border-gray-800 bg-gray-800/40">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center text-sm font-bold">
        <span sec:authentication="name" class="uppercase">U</span>
      </div>
      <div>
        <p class="text-sm font-semibold" sec:authentication="name">usuario</p>
        <p class="text-xs text-gray-400" sec:authorize="hasRole('ADMIN')">Administrador</p>
        <p class="text-xs text-gray-400" sec:authorize="!hasRole('ADMIN')">Familiar</p>
      </div>
    </div>
  </div>

  <div class="flex-1 py-3 space-y-1 px-3 overflow-y-auto">
    <a th:href="@{/calendario}" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-800 transition">
      📅 <span>Calendario</span>
    </a>

    <a th:href="@{/compra}" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-800 transition">
      🛒 <span>Lista de la Compra</span>
    </a>

    <button type="button" id="btn-menu-abrir-asistente" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-800 transition text-left cursor-pointer">
      🧠 <span>Asistente Inteligente</span>
    </button>

    <button type="button" id="btn-menu-toggle-dark" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-800 transition text-left cursor-pointer">
      <span id="menu-dark-icon">🌙</span> <span>Modo noche/día</span>
    </button>

    <a th:href="@{/admin/usuarios}" sec:authorize="hasRole('ADMIN')"
       class="flex items-center gap-3 px-4 py-3 rounded-xl bg-purple-900/30 hover:bg-purple-900/50 text-purple-300 transition font-medium border border-purple-800/40">
      👥 <span>Gestión Usuarios</span>
    </a>
  </div>

  <div class="px-5 py-4 border-t border-gray-800">
    <form th:action="@{/logout}" method="post">
      <button type="submit" class="w-full flex items-center justify-center gap-2 py-2 rounded-xl bg-red-600/20 hover:bg-red-600/40 text-red-400 transition text-sm cursor-pointer">
        🚪 Cerrar sesión
      </button>
    </form>
  </div>
</aside>

<!-- CONTENIDO PRINCIPAL -->
<div class="flex-1">
  <div th:replace="${content}"></div>
</div>

<!-- MODAL GLOBAL ASISTENTE FASI -->
<div id="modal-voz-global" class="fasi-modal">
  <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl flex flex-col border border-gray-200 dark:border-gray-700">
    <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
      <div>
        <h3 class="text-base font-bold text-gray-800 dark:text-gray-100 flex items-center gap-2">
          <span>🧠</span> Asistente Inteligente FASI
        </h3>
        <p class="text-xs text-gray-400">Pídele eventos, notas o gestionar tu compra</p>
      </div>
      <button type="button" id="btn-cerrar-modal-global" class="text-gray-400 hover:text-gray-200 text-2xl font-bold p-1 cursor-pointer">✕</button>
    </div>

    <div class="p-4 space-y-3">
      <textarea id="agente-input-texto" rows="3"
                placeholder="Ej: 'Añade a la compra leche y azúcar', 'Cena el sábado a las 21:00' o 'Quita el arroz'..."
                class="w-full border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm resize-none"></textarea>

      <div class="flex gap-2">
        <button type="button" id="agente-btn-micro"
                class="flex-1 flex items-center justify-center gap-2 bg-red-500 hover:bg-red-600 text-white py-2.5 rounded-xl font-semibold transition text-sm cursor-pointer">
          🎤 <span id="agente-micro-label">Grabar</span>
        </button>
        <button type="button" id="agente-btn-ejecutar"
                class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-semibold transition text-sm shadow cursor-pointer">
          ⚡ Ejecutar
        </button>
      </div>

      <div id="agente-spinner" style="display:none;" class="flex-col items-center justify-center py-4 space-y-2">
        <div class="flex gap-1.5 justify-center">
          <div class="w-2.5 h-2.5 bg-indigo-500 rounded-full animate-bounce"></div>
          <div class="w-2.5 h-2.5 bg-indigo-500 rounded-full animate-bounce" style="animation-delay:150ms"></div>
          <div class="w-2.5 h-2.5 bg-indigo-500 rounded-full animate-bounce" style="animation-delay:300ms"></div>
        </div>
        <p class="text-center text-xs text-gray-500 dark:text-gray-400 font-medium">FASI está procesando tu orden...</p>
      </div>

      <div id="agente-resultado" style="display:none;" class="p-4 bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800 rounded-xl space-y-3">
        <p id="agente-mensaje-respuesta" class="text-sm text-gray-800 dark:text-gray-100 leading-relaxed whitespace-pre-wrap"></p>
        <button type="button" id="agente-btn-aceptar"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-semibold text-xs transition cursor-pointer">
          Aceptar y actualizar 👍
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const sMenu = document.getElementById('sidebar-menu');
    const oMenu = document.getElementById('menu-overlay');
    const modalVoz = document.getElementById('modal-voz-global');
    const inputTexto = document.getElementById('agente-input-texto');
    const spinner = document.getElementById('agente-spinner');
    const resultado = document.getElementById('agente-resultado');
    const respuestaTxt = document.getElementById('agente-mensaje-respuesta');

    // Control Menú
    const abrirMenu = () => { sMenu.classList.add('open'); oMenu.style.display = 'block'; };
    const cerrarMenu = () => { sMenu.classList.remove('open'); oMenu.style.display = 'none'; };

    document.getElementById('btn-topbar-menu')?.addEventListener('click', () => {
      sMenu.classList.contains('open') ? cerrarMenu() : abrirMenu();
    });
    document.getElementById('btn-drawer-cerrar')?.addEventListener('click', cerrarMenu);
    oMenu?.addEventListener('click', cerrarMenu);

    // Modo Oscuro
    const toggleDark = () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('fasi-theme', isDark ? 'dark' : 'light');
      const icon = document.getElementById('menu-dark-icon');
      if (icon) icon.textContent = isDark ? '☀️' : '🌙';
    };
    document.getElementById('btn-menu-toggle-dark')?.addEventListener('click', () => {
      toggleDark();
      cerrarMenu();
    });

    if (localStorage.getItem('fasi-theme') === 'dark' || (!localStorage.getItem('fasi-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }

    // Modal Asistente
    const abrirAsistente = () => {
      cerrarMenu();
      if (resultado) resultado.style.display = 'none';
      if (inputTexto) inputTexto.value = '';
      if (modalVoz) modalVoz.style.display = 'flex';
    };
    const cerrarAsistente = () => {
      if (modalVoz) modalVoz.style.display = 'none';
    };

    document.getElementById('btn-topbar-asistente')?.addEventListener('click', abrirAsistente);
    document.getElementById('btn-menu-abrir-asistente')?.addEventListener('click', abrirAsistente);
    document.getElementById('btn-cerrar-modal-global')?.addEventListener('click', cerrarAsistente);
    document.getElementById('agente-btn-aceptar')?.addEventListener('click', () => {
      cerrarAsistente();
      window.location.reload();
    });

    // Micrófono
    let recognition = null;
    let grabando = false;
    const btnMicro = document.getElementById('agente-btn-micro');
    const labelMicro = document.getElementById('agente-micro-label');

    btnMicro?.addEventListener('click', () => {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('Tu navegador o sesión no soporta dictado por voz.');
        return;
      }
      if (grabando) {
        if (recognition) recognition.stop();
        return;
      }
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new Speech();
      recognition.lang = 'es-ES';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        grabando = true;
        if (labelMicro) labelMicro.textContent = 'Escuchando...';
        btnMicro.classList.replace('bg-red-500', 'bg-amber-600');
      };
      recognition.onresult = (e) => {
        if (inputTexto) inputTexto.value = e.results[0][0].transcript;
      };
      recognition.onend = () => {
        grabando = false;
        if (labelMicro) labelMicro.textContent = 'Grabar';
        btnMicro.classList.replace('bg-amber-600', 'bg-red-500');
      };
      recognition.start();
    });

    // Ejecutar Orden
    document.getElementById('agente-btn-ejecutar')?.addEventListener('click', async () => {
      const texto = inputTexto ? inputTexto.value.trim() : '';
      if (!texto) return;

      if (spinner) spinner.style.display = 'flex';
      if (resultado) resultado.style.display = 'none';

      try {
        const resp = await fetch('/calendario/api/agente', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ texto })
        });
        const data = await resp.json();
        if (spinner) spinner.style.display = 'none';
        if (respuestaTxt) respuestaTxt.textContent = data.mensaje;
        if (resultado) resultado.style.display = 'block';
      } catch (err) {
        if (spinner) spinner.style.display = 'none';
        alert('Error conectando con el asistente: ' + err.message);
      }
    });
  });
</script>

</body>
</html>
