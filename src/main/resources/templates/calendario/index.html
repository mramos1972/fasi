<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Calendario — FASI</title></head>
<body>
<section class="pb-2 flex flex-col flex-1 h-[calc(100dvh-4rem)] select-none" id="swipe-area">

  <!-- SELECTOR DE CALENDARIO FAMILIAR (SI HAY MÁS DE 1 CALENDARIO VISIBLE) -->
  <div th:if="${usuariosVisibles != null and usuariosVisibles.size() > 1}"
       class="flex items-center justify-between mb-2 px-1 text-xs">
    <span class="text-gray-500 dark:text-gray-400 font-semibold flex items-center gap-1">
      👀 <span>Agenda de:</span>
    </span>
    <select onchange="cambiarFiltroUsuario(this.value)"
            class="border border-gray-300 dark:border-gray-600 rounded-lg px-2.5 py-1 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500">
      <option value="mi" th:selected="${usuarioSeleccionado == 'mi'}">👤 Mi calendario</option>
      <option value="todos" th:selected="${usuarioSeleccionado == 'todos'}">👨‍👩‍👧‍👦 Todos juntos</option>
      <option th:each="u : ${usuariosVisibles}"
              th:if="${u.id != usuarioActual.id}"
              th:value="${u.id}"
              th:text="'📅 ' + ${u.nombre ?: u.username}"
              th:selected="${usuarioSeleccionado == u.id.toString()}"></option>
    </select>
  </div>

  <script>
    function cambiarFiltroUsuario(val) {
      const url = new URL(window.location.href);
      url.searchParams.set('usuario', val);
      window.location.href = url.toString();
    }
  </script>

  <!-- CABECERA DÍAS -->
  <div class="grid grid-cols-7 mb-1 pt-1">
    <div th:each="dia : ${ {'L','M','X','J','V','S','D'} }"
         class="text-center text-xs font-semibold text-gray-400 dark:text-gray-500 py-1"
         th:text="${dia}"></div>
  </div>

  <!-- GRID CALENDARIO -->
  <div id="grid-calendario"
       class="grid grid-cols-7 border border-gray-200 dark:border-gray-700 rounded-xl overflow-hidden flex-1"
       style="grid-auto-rows: 1fr;"></div>

  <!-- MODAL ASISTENTE AGÉNTICO FASI -->
  <div id="modal-voz" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 p-0 sm:p-4">
    <div class="bg-white dark:bg-gray-800 rounded-t-2xl sm:rounded-2xl shadow-2xl
                w-full sm:max-w-lg mx-0 sm:mx-4 relative
                max-h-[90dvh] flex flex-col">

      <!-- HEADER -->
      <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
        <div>
          <h3 class="text-base font-bold text-gray-800 dark:text-gray-100 flex items-center gap-2">
            <span>🧠</span> Agente Inteligente FASI
          </h3>
          <p class="text-xs text-gray-400">Consulta, crea y opera de forma autónoma</p>
        </div>
        <button onclick="cerrarModalVoz()" class="text-gray-400 hover:text-gray-200 text-2xl font-bold p-1">✕</button>
      </div>

      <!-- CONTENIDO -->
      <div class="p-4 overflow-y-auto space-y-3 flex-1">
        
        <div id="ia-input-container">
          <textarea id="voz-texto" rows="3"
                    placeholder="Ej: 'Bórrame la comida en Madrid del 12' o 'Crea dos eventos: cumple de Martín el 7 a las 7 y cena el 10'..."
                    class="w-full border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3
                           bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100
                           focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm resize-none"></textarea>

          <div class="flex gap-2 mt-2">
            <button id="btn-micro" onclick="toggleMicrofono()"
                    class="flex-1 flex items-center justify-center gap-2 bg-red-500 hover:bg-red-600 text-white py-2.5 rounded-xl font-semibold transition text-sm">
              🎤 <span id="micro-label">Grabar</span>
            </button>
            <button onclick="ejecutarOrdenAgente()"
                    class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-semibold transition text-sm">
              ⚡ Ejecutar Orden
            </button>
          </div>
        </div>

        <!-- SPINNER RAZONAMIENTO AGÉNTICO -->
        <div id="ia-spinner" style="display:none" class="flex flex-col items-center justify-center py-6 text-sm text-indigo-500 space-y-2">
          <div class="flex gap-1.5">
            <div class="w-2.5 h-2.5 bg-indigo-500 rounded-full animate-bounce"></div>
            <div class="w-2.5 h-2.5 bg-indigo-500 rounded-full animate-bounce" style="animation-delay:150ms"></div>
            <div class="w-2.5 h-2.5 bg-indigo-500 rounded-full animate-bounce" style="animation-delay:300ms"></div>
          </div>
          <span class="text-xs text-gray-500 dark:text-gray-400 font-medium">El agente está consultando y operando en tu base de datos...</span>
        </div>

        <!-- RESULTADO CONVERSACIONAL -->
        <div id="ia-resultado" style="display:none" class="space-y-4">
          <div class="p-4 bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800 rounded-xl">
            <p class="text-xs uppercase font-bold text-indigo-500 mb-1">Respuesta de FASI:</p>
            <p id="ia-mensaje-texto" class="text-sm text-gray-800 dark:text-gray-100 leading-relaxed whitespace-pre-wrap"></p>
          </div>

          <button onclick="finalizarAccion()"
                  class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-semibold transition text-sm">
            Entendido 👍
          </button>
        </div>

      </div>
    </div>
  </div>

  <script th:inline="javascript">
    /*<![CDATA[*/
    const EVENTOS_MES = /*[[${eventos}]]*/ [];
    const YEAR_MONTH  = /*[[${yearMonth.toString()}]]*/ '';
    const HOY         = /*[[${hoy.toString()}]]*/ '';
    const USUARIO_PARAM = /*[[${usuarioSeleccionado}]]*/ 'mi';

    const parts = YEAR_MONTH.split('-');
    const currentYear  = parseInt(parts[0], 10);
    const currentMonth = parseInt(parts[1], 10);

    function irMes(delta) {
      const d = new Date(currentYear, currentMonth - 1 + delta, 1);
      window.location = '/calendario?year=' + d.getFullYear() + '&month=' + (d.getMonth() + 1) + '&usuario=' + encodeURIComponent(USUARIO_PARAM);
    }

    (function inyectarHeaderMes() {
      const slot = document.getElementById('header-title-slot');
      if (!slot) return;
      const nombreMes = new Date(currentYear, currentMonth - 1, 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
      const cap = nombreMes.charAt(0).toUpperCase() + nombreMes.slice(1);
      slot.innerHTML = `
        <button onclick="irMes(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-lg font-bold">‹</button>
        <span class="font-bold text-gray-800 dark:text-gray-100 text-sm sm:text-base px-1">${cap}</span>
        <button onclick="irMes(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-lg font-bold">›</button>
      `;
    })();

    // Swipe táctil
    let touchStartX = 0, touchEndX = 0;
    const swipeArea = document.getElementById('swipe-area');
    swipeArea.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
    swipeArea.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 60) irMes(1);
      if (touchEndX > touchStartX + 60) irMes(-1);
    }, {passive: true});

    function renderCalendario() {
      const primer = new Date(currentYear, currentMonth - 1, 1);
      const ultimo = new Date(currentYear, currentMonth, 0).getDate();
      let col0 = primer.getDay() - 1;
      if (col0 < 0) col0 = 6;

      const grid = document.getElementById('grid-calendario');
      grid.innerHTML = '';

      for (let i = 0; i < col0; i++) {
        const vacia = document.createElement('div');
        vacia.className = 'border-b border-r border-gray-100 dark:border-gray-800 bg-gray-50/40 dark:bg-gray-900/20';
        grid.appendChild(vacia);
      }

      for (let dia = 1; dia <= ultimo; dia++) {
        const mm = String(currentMonth).padStart(2, '0');
        const dd = String(dia).padStart(2, '0');
        const fechaStr = `${currentYear}-${mm}-${dd}`;
        const esHoy = (fechaStr === HOY);

        const celda = document.createElement('div');
        celda.className = 'border-b border-r border-gray-100 dark:border-gray-800 p-1 cursor-pointer hover:bg-indigo-50 dark:hover:bg-indigo-900/20 transition flex flex-col justify-between';
        celda.onclick = () => window.location = '/calendario/dia/' + fechaStr + '?usuario=' + encodeURIComponent(USUARIO_PARAM);

        const fila = document.createElement('div');
        fila.className = 'flex justify-between items-center';
        const num = document.createElement('span');
        num.className = esHoy ? 'bg-indigo-600 text-white w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold' : 'text-xs text-gray-700 dark:text-gray-300 font-medium';
        num.textContent = dia;
        fila.appendChild(num);
        celda.appendChild(fila);

        const eventosDia = EVENTOS_MES.filter(e => {
          const f = Array.isArray(e.fechaInicio) ? `${e.fechaInicio[0]}-${String(e.fechaInicio[1]).padStart(2,'0')}-${String(e.fechaInicio[2]).padStart(2,'0')}` : e.fechaInicio;
          return f === fechaStr;
        });

        const contEv = document.createElement('div');
        contEv.className = 'flex-1 overflow-hidden space-y-0.5 mt-0.5';
        eventosDia.slice(0, 2).forEach(e => {
          const pill = document.createElement('div');
          pill.className = 'text-[10px] px-1 py-0.5 rounded text-white truncate font-medium flex items-center gap-0.5';
          
          // Color efectivo (personalizado o del tipo)
          const colorFinal = (e.colorPersonalizado && e.colorPersonalizado.trim() !== '') 
                             ? e.colorPersonalizado 
                             : ((e.tipo && e.tipo.color) ? e.tipo.color : '#6366f1');
          pill.style.backgroundColor = colorFinal;
          
          let textoPill = (e.tipo && e.tipo.emoji ? e.tipo.emoji + ' ' : '') + e.titulo;
          if (USUARIO_PARAM === 'todos' && e.usuario && e.usuario.nombre) {
            textoPill = `[${e.usuario.nombre.charAt(0)}] ` + textoPill;
          }
          pill.textContent = textoPill;
          contEv.appendChild(pill);
        });
        if (eventosDia.length > 2) {
          const mas = document.createElement('div');
          mas.className = 'text-[9px] text-gray-400 pl-0.5';
          mas.textContent = `+${eventosDia.length - 2}`;
          contEv.appendChild(mas);
        }
        celda.appendChild(contEv);
        grid.appendChild(celda);
      }
    }

    let recargarAlTerminar = false;

    window.abrirModalVoz = function() {
      document.getElementById('modal-voz').classList.remove('hidden');
      document.getElementById('ia-resultado').style.display = 'none';
      document.getElementById('ia-input-container').style.display = 'block';
      recargarAlTerminar = false;
    };

    function cerrarModalVoz() {
      document.getElementById('modal-voz').classList.add('hidden');
      if (recargarAlTerminar) window.location.reload();
    }

    function finalizarAccion() {
      cerrarModalVoz();
      if (recargarAlTerminar) window.location.reload();
    }

    async function ejecutarOrdenAgente() {
      const texto = document.getElementById('voz-texto').value.trim();
      if (!texto) return alert('Por favor, indica una orden.');

      document.getElementById('ia-spinner').style.display = 'flex';
      document.getElementById('ia-input-container').style.display = 'none';
      document.getElementById('ia-resultado').style.display = 'none';

      try {
        const resp = await fetch('/calendario/api/agente', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ texto })
        });
        const data = await resp.json();

        recargarAlTerminar = data.huboMutacion;
        document.getElementById('ia-mensaje-texto').textContent = data.mensaje;
        document.getElementById('ia-resultado').style.display = 'block';

      } catch (err) {
        alert('Error ejecutando orden: ' + err.message);
        document.getElementById('ia-input-container').style.display = 'block';
      } finally {
        document.getElementById('ia-spinner').style.display = 'none';
      }
    }

    // Micrófono
    let recognition = null, grabando = false;
    function toggleMicrofono() {
      if (grabando) {
        if (recognition) recognition.stop();
        grabando = false;
        document.getElementById('micro-label').textContent = 'Grabar';
        document.getElementById('btn-micro').classList.remove('bg-red-700');
        return;
      }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return alert('Reconocimiento no disponible.');
      recognition = new SR();
      recognition.lang = 'es-ES';
      recognition.continuous = true;
      recognition.onresult = e => {
        let t = '';
        for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript + ' ';
        document.getElementById('voz-texto').value = t;
      };
      recognition.start();
      grabando = true;
      document.getElementById('micro-label').textContent = 'Parar';
      document.getElementById('btn-micro').classList.add('bg-red-700');
    }

    renderCalendario();
    /*]]>*/
  </script>
</section>
</body>
</html>
