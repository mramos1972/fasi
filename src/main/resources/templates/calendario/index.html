<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Calendario — FASI</title></head>
<body>
<section class="pb-2 flex flex-col flex-1 h-[calc(100dvh-4rem)] select-none" id="swipe-area">

  <!-- CABECERA DÍAS -->
  <div class="grid grid-cols-7 mb-1 pt-1">
    <div th:each="dia : ${ {'L','M','X','J','V','S','D'} }"
         class="text-center text-xs font-semibold text-gray-400 dark:text-gray-500 py-1"
         th:text="${dia}"></div>
  </div>

  <!-- GRID CALENDARIO -->
  <div id="grid-calendario"
       class="grid grid-cols-7 border border-gray-200 dark:border-gray-700 rounded-xl overflow-hidden flex-1"
       style="grid-auto-rows: 1fr;"></div>

  <!-- MODAL ASISTENTE IA (MOBILE FRIENDLY) -->
  <div id="modal-voz" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 p-0 sm:p-4">
    <div class="bg-white dark:bg-gray-800 rounded-t-2xl sm:rounded-2xl shadow-2xl
                w-full sm:max-w-lg mx-0 sm:mx-4 relative
                max-h-[90dvh] flex flex-col">

      <!-- HEADER -->
      <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
        <div>
          <h3 class="text-base font-bold text-gray-800 dark:text-gray-100 flex items-center gap-2">
            <span>✨</span> Asistente Inteligente FASI
          </h3>
          <p class="text-xs text-gray-400">Pide uno o varios eventos en una sola frase</p>
        </div>
        <button onclick="cerrarModalVoz()" class="text-gray-400 hover:text-gray-200 text-2xl font-bold p-1">✕</button>
      </div>

      <!-- CONTENIDO -->
      <div class="p-4 overflow-y-auto space-y-3 flex-1">
        
        <div id="ia-input-container">
          <textarea id="voz-texto" rows="3"
                    placeholder="Ej: Quiero meter dos eventos uno el 7 de Diciembre cumple de Martín a las 7 y otro el 12 de Diciembre comida en Madrid a las 4..."
                    class="w-full border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3
                           bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100
                           focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm resize-none"></textarea>

          <div class="flex gap-2 mt-2">
            <button id="btn-micro" onclick="toggleMicrofono()"
                    class="flex-1 flex items-center justify-center gap-2 bg-red-500 hover:bg-red-600 text-white py-2.5 rounded-xl font-semibold transition text-sm">
              🎤 <span id="micro-label">Grabar</span>
            </button>
            <button onclick="interpretarTexto()"
                    class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-semibold transition text-sm">
              ⚡ Interpretar con IA
            </button>
          </div>
        </div>

        <!-- SPINNER -->
        <div id="ia-spinner" style="display:none" class="flex items-center justify-center gap-2 py-4 text-sm text-indigo-500">
          <div class="w-2 h-2 bg-indigo-500 rounded-full animate-bounce"></div>
          <div class="w-2 h-2 bg-indigo-500 rounded-full animate-bounce" style="animation-delay:150ms"></div>
          <div class="w-2 h-2 bg-indigo-500 rounded-full animate-bounce" style="animation-delay:300ms"></div>
          <span>Gemini Flash está razonando tus eventos...</span>
        </div>

        <!-- RESULTADOS MULTI-EVENTO -->
        <div id="ia-resultados" style="display:none" class="space-y-3">
          <div id="ia-mensaje-resumen" class="p-3 bg-indigo-50 dark:bg-indigo-900/40 text-indigo-800 dark:text-indigo-200 rounded-xl text-xs font-medium"></div>
          
          <div id="lista-eventos-cards" class="space-y-2 max-h-60 overflow-y-auto"></div>

          <div class="flex gap-2 pt-2">
            <button id="btn-confirmar-todos" onclick="confirmarTodosEventos()"
                    class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-xl font-semibold transition text-sm shadow">
              ✅ Guardar en Calendario
            </button>
            <button onclick="cerrarModalVoz()"
                    class="px-4 py-2.5 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-xl text-sm">
              Cancelar
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script th:inline="javascript">
    /*<![CDATA[*/
    const EVENTOS_MES = /*[[${eventos}]]*/ [];
    const YEAR_MONTH  = /*[[${yearMonth.toString()}]]*/ '';
    const HOY         = /*[[${hoy.toString()}]]*/ '';

    const parts = YEAR_MONTH.split('-');
    const currentYear  = parseInt(parts[0], 10);
    const currentMonth = parseInt(parts[1], 10);

    // ── GESTIÓN DE NAVEGACIÓN Y SWIPE TÁCTIL ──
    function irMes(delta) {
      const d = new Date(currentYear, currentMonth - 1 + delta, 1);
      window.location = '/calendario?year=' + d.getFullYear() + '&month=' + (d.getMonth() + 1);
    }

    (function inyectarHeaderMes() {
      const slot = document.getElementById('header-title-slot');
      if (!slot) return;
      const nombreMes = new Date(currentYear, currentMonth - 1, 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
      const cap = nombreMes.charAt(0).toUpperCase() + nombreMes.slice(1);
      slot.innerHTML = `
        <button onclick="irMes(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-lg font-bold">‹</button>
        <span class="font-bold text-gray-800 dark:text-gray-100 text-sm sm:text-base px-1">${cap}</span>
        <button onclick="irMes(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-lg font-bold">›</button>
      `;
    })();

    // Gesto de deslizamiento (Swipe)
    let touchStartX = 0;
    let touchEndX = 0;
    const swipeArea = document.getElementById('swipe-area');

    swipeArea.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, {passive: true});

    swipeArea.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, {passive: true});

    function handleSwipe() {
      const threshold = 60; // distancia mínima en px
      if (touchEndX < touchStartX - threshold) {
        irMes(1);  // Swipe a la izquierda → siguiente mes
      }
      if (touchEndX > touchStartX + threshold) {
        irMes(-1); // Swipe a la derecha → mes anterior
      }
    }

    // ── RENDER CALENDARIO ──
    function renderCalendario() {
      const primer = new Date(currentYear, currentMonth - 1, 1);
      const ultimo = new Date(currentYear, currentMonth, 0).getDate();
      let col0 = primer.getDay() - 1;
      if (col0 < 0) col0 = 6;

      const grid = document.getElementById('grid-calendario');
      grid.innerHTML = '';

      for (let i = 0; i < col0; i++) {
        const vacia = document.createElement('div');
        vacia.className = 'border-b border-r border-gray-100 dark:border-gray-800 bg-gray-50/40 dark:bg-gray-900/20';
        grid.appendChild(vacia);
      }

      for (let dia = 1; dia <= ultimo; dia++) {
        const mm = String(currentMonth).padStart(2, '0');
        const dd = String(dia).padStart(2, '0');
        const fechaStr = `${currentYear}-${mm}-${dd}`;
        const esHoy = (fechaStr === HOY);

        const celda = document.createElement('div');
        celda.className = 'border-b border-r border-gray-100 dark:border-gray-800 p-1 cursor-pointer hover:bg-indigo-50 dark:hover:bg-indigo-900/20 transition flex flex-col justify-between';
        celda.onclick = () => window.location = '/calendario/dia/' + fechaStr;

        const fila = document.createElement('div');
        fila.className = 'flex justify-between items-center';
        const num = document.createElement('span');
        num.className = esHoy ? 'bg-indigo-600 text-white w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold' : 'text-xs text-gray-700 dark:text-gray-300 font-medium';
        num.textContent = dia;
        fila.appendChild(num);
        celda.appendChild(fila);

        const eventosDia = EVENTOS_MES.filter(e => {
          const f = Array.isArray(e.fechaInicio) ? `${e.fechaInicio[0]}-${String(e.fechaInicio[1]).padStart(2,'0')}-${String(e.fechaInicio[2]).padStart(2,'0')}` : e.fechaInicio;
          return f === fechaStr;
        });

        const contEv = document.createElement('div');
        contEv.className = 'flex-1 overflow-hidden space-y-0.5 mt-0.5';
        eventosDia.slice(0, 2).forEach(e => {
          const pill = document.createElement('div');
          pill.className = 'text-[10px] px-1 py-0.5 rounded text-white truncate font-medium';
          pill.style.backgroundColor = (e.tipo && e.tipo.color) ? e.tipo.color : '#6366f1';
          pill.textContent = (e.tipo && e.tipo.emoji ? e.tipo.emoji + ' ' : '') + e.titulo;
          contEv.appendChild(pill);
        });
        if (eventosDia.length > 2) {
          const mas = document.createElement('div');
          mas.className = 'text-[9px] text-gray-400 pl-0.5';
          mas.textContent = `+${eventosDia.length - 2}`;
          contEv.appendChild(mas);
        }
        celda.appendChild(contEv);
        grid.appendChild(celda);
      }
    }

    // ── MODAL IA CON RECONOCIMIENTO Y MULTI-EVENTO ──
    let eventosPendientes = [];

    window.abrirModalVoz = function() {
      document.getElementById('modal-voz').classList.remove('hidden');
      document.getElementById('ia-resultados').style.display = 'none';
      document.getElementById('ia-input-container').style.display = 'block';
    };

    function cerrarModalVoz() {
      document.getElementById('modal-voz').classList.add('hidden');
    }

    async function interpretarTexto() {
      const texto = document.getElementById('voz-texto').value.trim();
      if (!texto) return alert('Escribe o dicta algo primero.');

      document.getElementById('ia-spinner').style.display = 'flex';
      document.getElementById('ia-resultados').style.display = 'none';

      try {
        const resp = await fetch('/calendario/api/interpretar-accion', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ texto })
        });
        const data = await resp.json();

        if (!data.exito || !data.crear || data.crear.length === 0) {
          alert(data.mensajeUsuario || 'No se pudieron extraer eventos.');
          return;
        }

        eventosPendientes = data.crear;
        document.getElementById('ia-mensaje-resumen').textContent = data.mensajeUsuario;

        const cards = document.getElementById('lista-eventos-cards');
        cards.innerHTML = data.crear.map(e => `
          <div class="p-3 bg-gray-50 dark:bg-gray-700/60 rounded-xl border border-gray-200 dark:border-gray-600 text-xs">
            <div class="flex justify-between items-center mb-1">
              <span class="font-bold text-gray-900 dark:text-gray-100 text-sm">${escapeHtml(e.titulo)}</span>
              <span class="px-2 py-0.5 rounded-full text-white font-semibold text-[10px]" style="background-color: ${e.tipo?.color || '#4f46e5'}">
                ${e.tipo?.label || 'Evento'}
              </span>
            </div>
            <div class="text-gray-600 dark:text-gray-300 space-y-0.5">
              <p>📅 Fecha: <strong>${e.fechaInicio}</strong></p>
              <p>⏰ Hora: <strong>${e.horaInicio || 'Pendiente de definir'}</strong></p>
              ${e.lugar ? `<p>📍 Lugar: <strong>${escapeHtml(e.lugar)}</strong></p>` : ''}
              ${e.personasRelacionadas ? `<p>👥 Con: <strong>${escapeHtml(e.personasRelacionadas)}</strong></p>` : ''}
            </div>
          </div>
        `).join('');

        document.getElementById('btn-confirmar-todos').textContent = `✅ Guardar ${data.crear.length} evento${data.crear.length > 1 ? 's' : ''}`;
        document.getElementById('ia-input-container').style.display = 'none';
        document.getElementById('ia-resultados').style.display = 'block';

      } catch (err) {
        alert('Error conectando con la IA: ' + err.message);
      } finally {
        document.getElementById('ia-spinner').style.display = 'none';
      }
    }

    async function confirmarTodosEventos() {
      if (!eventosPendientes.length) return;
      try {
        const resp = await fetch('/calendario/api/confirmar-lote', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(eventosPendientes)
        });
        if (resp.ok) {
          cerrarModalVoz();
          window.location.reload();
        } else {
          alert('Error al guardar eventos.');
        }
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }

    // Micrófono
    let recognition = null;
    let grabando = false;
    function toggleMicrofono() {
      if (grabando) {
        if (recognition) recognition.stop();
        grabando = false;
        document.getElementById('micro-label').textContent = 'Grabar';
        document.getElementById('btn-micro').classList.remove('bg-red-700');
        return;
      }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return alert('Reconocimiento no disponible en este navegador.');
      recognition = new SR();
      recognition.lang = 'es-ES';
      recognition.continuous = true;
      recognition.onresult = e => {
        let t = '';
        for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript + ' ';
        document.getElementById('voz-texto').value = t;
      };
      recognition.start();
      grabando = true;
      document.getElementById('micro-label').textContent = 'Parar';
      document.getElementById('btn-micro').classList.add('bg-red-700');
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }

    renderCalendario();
    /*]]>*/
  </script>
</section>
</body>
</html>
