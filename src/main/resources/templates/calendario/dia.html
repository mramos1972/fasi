<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Día — FASI</title></head>
<body>
<section>
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-2">
      <a th:href="@{/calendario(year=${fecha.year},month=${fecha.monthValue})}"
         class="p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition text-sm">‹ Volver</a>

      <a th:href="@{/calendario/dia/{f}(f=${fecha.minusDays(1)})}"
         class="w-8 h-8 flex items-center justify-center rounded-full
                hover:bg-gray-200 dark:hover:bg-gray-700 transition
                text-gray-600 dark:text-gray-300 font-bold text-lg"
         title="Día anterior">‹</a>

      <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100"
          th:text="${#temporals.format(fecha, 'EEEE, d MMMM yyyy')}"></h2>

      <a th:href="@{/calendario/dia/{f}(f=${fecha.plusDays(1)})}"
         class="w-8 h-8 flex items-center justify-center rounded-full
                hover:bg-gray-200 dark:hover:bg-gray-700 transition
                text-gray-600 dark:text-gray-300 font-bold text-lg"
         title="Día siguiente">›</a>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="abrirModalVozDia()"
              class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700
                     transition text-sm font-semibold flex items-center gap-1"
              title="Nuevo evento por voz">
        🎙️ Voz
      </button>
      <a th:href="@{/calendario/nuevo(fecha=${fecha})}"
         class="bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200
                px-4 py-2 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600
                transition text-sm font-semibold">
        ✏️ Manual
      </a>
    </div>
  </div>

  <!-- BARRA CONTEXTUAL DEL DÍA -->
  <div id="contexto-dia"
       class="mb-6 bg-gray-900 dark:bg-gray-800 text-white rounded-xl shadow
              overflow-x-auto scrollbar-hide">
    <div class="flex items-stretch divide-x divide-gray-700 min-w-max">

      <div class="flex flex-col items-center justify-center px-4 py-2 min-w-[80px]">
        <span class="text-base">🌅</span>
        <span class="text-xs text-amber-300 font-semibold" id="dia-amanecer">--:--</span>
        <span class="text-[10px] text-gray-400">Amanecer</span>
      </div>

      <div class="flex flex-col items-center justify-center px-4 py-2 min-w-[80px]">
        <span class="text-base">🌇</span>
        <span class="text-xs text-orange-300 font-semibold" id="dia-atardecer">--:--</span>
        <span class="text-[10px] text-gray-400">Atardecer</span>
      </div>

      <div class="flex flex-col items-center justify-center px-4 py-2 min-w-[80px]">
        <span class="text-base">🌊</span>
        <span class="text-xs text-blue-300 font-semibold" id="dia-pleamar1">--:--</span>
        <span class="text-[10px] text-gray-400">Pleamar</span>
      </div>

      <div class="flex flex-col items-center justify-center px-4 py-2 min-w-[80px]">
        <span class="text-base">🏖️</span>
        <span class="text-xs text-cyan-300 font-semibold" id="dia-bajamar1">--:--</span>
        <span class="text-[10px] text-gray-400">Bajamar</span>
      </div>

      <div class="flex flex-col items-center justify-center px-4 py-2 min-w-[80px]">
        <span class="text-base">🌊</span>
        <span class="text-xs text-blue-300 font-semibold" id="dia-pleamar2">--:--</span>
        <span class="text-[10px] text-gray-400">Pleamar 2</span>
      </div>

      <div class="flex flex-col items-center justify-center px-4 py-2 min-w-[80px]">
        <span class="text-base">🏖️</span>
        <span class="text-xs text-cyan-300 font-semibold" id="dia-bajamar2">--:--</span>
        <span class="text-[10px] text-gray-400">Bajamar 2</span>
      </div>

      <div class="flex flex-col items-center justify-center px-4 py-2 min-w-[100px]">
        <span class="text-base">📍</span>
        <span class="text-xs text-gray-300 font-semibold" id="dia-ciudad">Sanlúcar</span>
      </div>

    </div>
  </div>

  <script th:inline="javascript">
    /*<![CDATA[*/
    (async function() {
      const fechaStr = /*[[${#temporals.format(fecha, 'yyyy-MM-dd')}]]*/ '';
      try {
        const resp = await fetch('/contexto/api/datos?fecha=' + fechaStr);
        const d    = await resp.json();
        document.getElementById('dia-amanecer').textContent  = d.amanecer  || '--:--';
        document.getElementById('dia-atardecer').textContent = d.atardecer || '--:--';
        document.getElementById('dia-pleamar1').textContent  = d.pleamar1  || '--:--';
        document.getElementById('dia-bajamar1').textContent  = d.bajamar1  || '--:--';
        document.getElementById('dia-pleamar2').textContent  = d.pleamar2  || '--:--';
        document.getElementById('dia-bajamar2').textContent  = d.bajamar2  || '--:--';
        document.getElementById('dia-ciudad').textContent    = (d.ciudad || 'Sanlúcar').split(' ')[0];
      } catch(e) {
        console.warn('Contexto del día no disponible:', e.message);
      }
    })();

    function abrirModalVozDia() {
      const fechaStr = /*[[${#temporals.format(fecha, 'yyyy-MM-dd')}]]*/ '';
      if (typeof abrirModalVozGlobal === 'function') {
        abrirModalVozGlobal();
        setTimeout(() => {
          const ta = document.getElementById('gp-voz-texto');
          if (ta && !ta.value) {
            ta.placeholder = 'Ej: "Cita médica a las 10" (se usará el ' + fechaStr + ')';
          }
        }, 150);
      }
    }
    /*]]>*/
  </script>

  <!-- Lista de eventos del día -->
  <div class="space-y-3">
    <div th:each="e : ${eventos}"
         class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 flex gap-4 items-start
                border-l-4"
         th:style="'border-color:' + ${e.tipo.color}">
      <span class="text-3xl" th:text="${e.tipo.emoji}"></span>
      <div class="flex-1">
        <div class="flex items-center gap-2 mb-1">
          <span class="text-xs font-semibold px-2 py-0.5 rounded-full text-white"
                th:style="'background-color:' + ${e.tipo.color}"
                th:text="${e.tipo.label}"></span>
          <span th:if="${e.horaInicio != null}"
                class="text-sm text-gray-500"
                th:text="${e.horaInicio} + (${e.horaFin != null} ? ' – ' + ${e.horaFin} : '')"></span>
        </div>
        <h3 class="font-semibold text-gray-800 dark:text-gray-100 text-lg"
            th:text="${e.titulo}"></h3>
        <div th:if="${e.etiquetas != null and !e.etiquetas.isEmpty()}"
             class="flex flex-wrap gap-1 mt-1">
          <span th:each="tag : ${e.etiquetas}"
                class="text-[10px] px-1.5 py-0.5 rounded-full bg-gray-100 dark:bg-gray-700
                       text-gray-600 dark:text-gray-300 font-medium"
                th:text="'#' + ${tag}"></span>
        </div>
        <p th:if="${e.lugar != null}"
           class="text-sm text-gray-500 mt-1">📍 <span th:text="${e.lugar}"></span></p>
        <p th:if="${e.personasRelacionadas != null}"
           class="text-sm text-gray-500">👥 <span th:text="${e.personasRelacionadas}"></span></p>
        <p th:if="${e.descripcion != null}"
           class="text-sm text-gray-600 dark:text-gray-300 mt-2"
           th:text="${e.descripcion}"></p>
      </div>
      <div class="flex flex-col gap-2">
        <a th:href="@{/calendario/{id}/editar(id=${e.id})}"
           class="text-blue-500 hover:underline text-xs">Editar</a>
        <form th:action="@{/calendario/{id}/eliminar(id=${e.id})}" method="post"
              onsubmit="return confirm('¿Eliminar?')">
          <button type="submit" class="text-red-400 hover:underline text-xs">Eliminar</button>
        </form>
      </div>
    </div>

    <div th:if="${#lists.isEmpty(eventos)}"
         class="bg-white dark:bg-gray-800 rounded-xl shadow p-12 text-center">
      <p class="text-5xl mb-3">📭</p>
      <p class="text-gray-400">No hay eventos para este día.</p>
      <p class="text-xs text-gray-400 mt-2">Usa los botones de arriba para añadir uno.</p>
    </div>
  </div>
</section>
</body>
</html>
