<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FASI — Iniciar sesión</title>
  <!-- Usar script local para evitar bloqueos por proxy o cortes offline -->
  <script th:src="@{/js/tailwind.min.js}"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl p-8 sm:p-10 w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-gray-900 flex items-center justify-center gap-2">
        <span>⚡</span> FASI
      </h1>
      <p class="text-gray-500 text-sm mt-1">Full Assistant</p>
    </div>

    <div th:if="${param.error}" class="bg-red-50 text-red-600 text-sm rounded-lg p-3 mb-4 border border-red-200">
      Usuario o contraseña incorrectos.
    </div>

    <div th:if="${param.logout}" class="bg-green-50 text-green-600 text-sm rounded-lg p-3 mb-4 border border-green-200">
      Sesión cerrada correctamente.
    </div>

    <form th:action="@{/login}" method="post" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
        <input type="text" name="username" required autofocus
               class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input type="password" name="password" required
               class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"/>
      </div>
      <button type="submit"
              class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition shadow-sm">
        Entrar
      </button>
    </form>
  </div>
</body>
</html>
