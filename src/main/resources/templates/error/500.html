<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
  <title>Error 500 — FASI</title>
</head>
<body>
<main class="max-w-xl mx-auto px-4 py-16 text-center">
  <p class="text-6xl mb-4">⚠️</p>
  <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-2">Error inesperado</h1>
  <p class="text-sm text-gray-500 dark:text-gray-400 mb-6" th:text="${error} ?: 'Ha ocurrido un problema interno en el servidor.'">
    Ha ocurrido un problema interno en el servidor.
  </p>
  <a th:href="@{/calendario}"
     class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm px-6 py-2.5 rounded-xl transition shadow">
    Volver al Calendario
  </a>
</main>
</body>
</html>
